version: '3.8'

services:
  app:
    image: openjdk:8-jdk-alpine
    container_name: sweech_java_app
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    ports:
      - "3001:3001"
    command: ["sh", "-c", "mvn spring-boot:run"]
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: sweech_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sweech
      MYSQL_USER: sweech
      MYSQL_PASSWORD: sweech
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
